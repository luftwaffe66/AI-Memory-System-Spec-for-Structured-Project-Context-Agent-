# /memory for Gemini CLI (project + user scope).
# Project: <repo>/.gemini/commands/memory.toml → /memory
# User (global): ~/.gemini/commands/memory.toml → /memory (all projects)
description = "Recall project memory or save a new entry (ai-memory-system skill)"

prompt = """
Read and follow the skill file NOW: `.agents/skills/ai-memory-system/SKILL.md`
(fallbacks: `.gemini/skills/ai-memory-system/SKILL.md`, `~/.agents/skills/ai-memory-system/SKILL.md`, `~/.gemini/skills/ai-memory-system/SKILL.md`).

User input: {{args}}

Rules:
- If user input is empty or asks to recall/history/why/what changed → do RECALL: read `memory/index.md` in the CURRENT project, load only relevant `memory/*.md` files, answer with rationale + impact + file links.
- If user input describes a change/decision/fix/refactor (or says save/remember/guardar) → do PERSIST: create `memory/YYYY-MM-DD_HH-MM_<slug>.md` from the right template in the skill's `references/` dir, sync `memory/index.md` (descending, no duplicates), then validate with the skill's `scripts/validate-memory.sh --root .`.
- Every entry needs Meta (Date, Time 24h, Type, Scope, Tags kebab-case), sections Context/Action/Result/Impact (+ Follow-up if risks). No TBD/later/pending without context. Max 200 lines.
- If input is ambiguous, recall first, then ask whether to save a new memory.

Examples:
- `/memory` → show recent index + suggest relevant entries
- `/memory why JWT?` → recall auth decision
- `/memory save migrated auth to JWT, refactor, scope auth/` → persist new entry
"""
